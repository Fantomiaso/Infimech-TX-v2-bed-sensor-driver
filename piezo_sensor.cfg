# Piezo Bed Sensor Configuration v1.0.0
# ================================
# Piezoelectric Bed Sensor Configuration
#
# HARDWARE:
#   Bed sensor from Infimech TX v2 printer (Flyingbear S1 new revision).
#   Sensor board: STM32G030 (auxiliary microcontroller).
#   Interface: MCU I2C bus (NOT host!).
#   I2C Address: 0x40 (64 decimal).
#   Bus Speed: 400 kHz.
#   Trigger Signal: PF4 pin on Manta M8P v2 (inverted).
#
# POWER (IMPORTANT!):
#   Sensor board has specific power scheme.
#   Two options available (only one at a time!):
#     1) Via I2C connector: 3.3V voltage
#     2) Via PROBE connector: 5V voltage
#   On MANTA 8P v2 board, 5V via PROBE cable is more convenient.
#
# THRESHOLD MEMORY:
#   Thresholds are stored in STM32G030 RAM (volatile memory).
#   On full power-off, thresholds reset.
#   For long-term storage, specify thresholds in default_thresholds parameter
#   and save configuration.

[piezo_bed_sensor]
# MCU and I2C bus connected to sensor.
i2c_mcu: mcu                    # MCU name in Klipper (usually "mcu" for main board)
i2c_bus: i2c3_PA8_PC9           # I2C3 bus, pins PA8 (SCL) and PC9 (SDA)
i2c_address: 64                 # I2C address in decimal (0x40 = 64)
i2c_speed: 400000               # Bus speed: 400 kHz

# Safe position for calibration.
calibration_safe_x: 110         # X coordinate (mm)
calibration_safe_y: 110         # Y coordinate (mm)
calibration_safe_z: 50          # Z coordinate (mm, safe height)

# Vibration parameters for calibration.
calibration_vibration_accel: 20000    # Shake acceleration (mm/s²)
calibration_vibration_freq: 20       # Vibration frequency (Hz)
calibration_block_duration: 1.0      # Vibration block duration (sec)

# Calibration strategy.
calibration_margin: 100         # Threshold margin (ADC counts)
calibration_min_step: 20        # Minimum binary search step
calibration_baseline_samples: 100    # Baseline measurement count

# Axis calibration order.
shake_XY_first: True            # True = XY first (recommended)

# Final verification after calibration.
perform_final_test: True        # True = verify new thresholds after calibration

# Default thresholds (from last successful calibration).
# Stored in STM32 volatile RAM. Specify here for auto-loading.
# Format: four numbers separated by commas (channel 0, 1, 2, 3).
default_thresholds: 281, 280, 277, 281

# Bed temperature during calibration (°C).
calibration_bed_temp: 60        # 60°C — standard for PLA

# Validation duration (seconds).
validation_duration: 1.0        # 1.0 sec = 8 XY cycles

# Margin above baseline for test threshold.
validation_test_margin: 3       # ADC counts
