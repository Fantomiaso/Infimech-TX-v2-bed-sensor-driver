# BIGTREETECH Manta M8P V2.0 Configuration
# For Flyingbear S1 / Infimech TX1 with CoreXY kinematics
# 
# ============================================================================
# FILE DESCRIPTION
# ============================================================================
# This is the main printer configuration file for Klipper. It defines all
# hardware parameters: kinematics, drivers, endstops, heaters, fans,
# and custom G-code macros.
#
# IMPORTANT: This file contains user settings. The SAVE_CONFIG section at
# the end is auto-generated by Klipper. Do not edit it manually — use
# SAVE_CONFIG or BED_MESH_PROFILE SAVE=... commands instead.
#
# ============================================================================
# INCLUDED FILES
# ============================================================================
# piezo_sensor.cfg — piezoelectric bed sensor configuration.
#                    Must be in the same directory.
# mainsail.cfg — Mainsail web interface configuration (auto-generated
#                during installation).
[include piezo_sensor.cfg]
[include mainsail.cfg]


# ============================================================================
# MCU (Microcontroller)
# ============================================================================
# Defines connection to the BIGTREETECH Manta M8P V2.0 control board
# based on STM32H723. The device path depends on your specific printer.
# To find the path: ls /dev/serial/by-id/
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_100032001751313431393536-if00


# ============================================================================
# PRINTER (Kinematics and Limits)
# ============================================================================
# CoreXY — kinematics where X and Y are controlled simultaneously by two motors.
# Diagonal movement: both motors rotate in the same direction.
# X or Y movement: motors rotate in opposite directions.
[printer]
kinematics: corexy
max_velocity: 600          # Maximum travel speed (mm/s)
max_accel: 9000            # Maximum acceleration (mm/s²)
max_z_velocity: 30         # Maximum Z speed (mm/s)
max_z_accel: 800           # Maximum Z acceleration (mm/s²)
square_corner_velocity: 5.0  # Corner speed for trajectory smoothing
minimum_cruise_ratio: 0.5    # Minimum cruise speed ratio

# Idle timeout — disables extruder motor after 10 minutes of inactivity
[idle_timeout]
timeout: 600
gcode: M84 E

# Input Shaper — software resonance (vibration) compensation.
# Frequencies are determined via SHAPER_CALIBRATE command with ADXL345.
[input_shaper]
shaper_freq_x: 59.6        # Resonance frequency of X axis (Hz)
shaper_freq_y: 55.2        # Resonance frequency of Y axis (Hz)
shaper_type_x: mzv         # Filter type for X (mzv — good balance)
shaper_type_y: mzv         # Filter type for Y


# ============================================================================
# TEMPERATURE SENSORS
# ============================================================================
# Monitoring MCU (board microcontroller) and host (Orange Pi) temperatures
[temperature_sensor MCU]
sensor_type: temperature_mcu

[temperature_sensor HOST]
sensor_type: temperature_host


# ============================================================================
# X AXIS (Motor3 — far right motor)
# ============================================================================
# Connection: Motor3 on M8P board
# Purpose: controls X movement in pair with Motor4 (Y)
[stepper_x]
step_pin: PB8              # Step pin (STEP)
dir_pin: !PB7              # Direction pin (DIR), ! = invert
enable_pin: !PE0           # Driver enable pin (EN), ! = active LOW
microsteps: 16             # Microsteps per full step
rotation_distance: 40      # mm per shaft rotation (for 20T GT2 pulleys)
full_steps_per_rotation: 200  # Steps per rotation (1.8° motor)
endstop_pin: tmc2209_stepper_x:virtual_endstop  # Virtual endstop via StallGuard
position_endstop: -2.5     # Position at endstop trigger
position_min: -2.5         # Minimum position (can go past edge)
position_max: 222          # Maximum position
homing_speed: 40           # Homing speed (mm/s)
homing_retract_dist: 0     # Retract distance after trigger (0 = no retract)
step_pulse_duration: 0.000004  # Step pulse duration (for TMC2209)

# TMC2209 driver for X axis
[tmc2209 stepper_x]
uart_pin: PB9              # UART pin for driver communication
interpolate: True          # Interpolate microsteps to 256
run_current: 1.2           # Running current (A)
hold_current: 0.5          # Hold current (A)
sense_resistor: 0.110      # Current sense resistor (Ohms)
stealthchop_threshold: 0   # StealthChop threshold (0 = always SpreadCycle)
driver_SGTHRS: 97          # StallGuard threshold (0-255, experimentally tuned)
diag_pin: PF2              # Diagnostic pin (for sensorless homing)


# ============================================================================
# Y AXIS (Motor4 — far left motor)
# ============================================================================
# Connection: Motor4 on M8P board
# Purpose: controls Y movement in pair with Motor3 (X)
[stepper_y]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -3
position_min: -3
position_max: 225
homing_speed: 40
homing_retract_dist: 0
step_pulse_duration: 0.000004

[tmc2209 stepper_y]
uart_pin: PB5
interpolate: True
run_current: 1.2
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0
driver_SGTHRS: 100         # StallGuard threshold for Y (may differ from X)
diag_pin: PF1


# ============================================================================
# Z AXIS — Motor5 (Z1, left lead screw)
# ============================================================================
# Connection: Motor5 on M8P board
# Purpose: left side of Z axis
[stepper_z]
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
microsteps: 16
rotation_distance: 8       # mm per rotation (for T8 lead screw with 2mm pitch and 1:4 reduction)
endstop_pin: tmc2209_stepper_z:virtual_endstop
position_endstop: -5.5     # Z position at bed contact (tuned)
position_min: -5.5         # Can go below contact point
position_max: 260          # Maximum height
#position_min: -6.0        # Alternative value (commented out)
homing_speed: 5            # Slow Z homing (important for accuracy)
second_homing_speed: 3     # Even slower for second touch
homing_retract_dist: 0     # No retract (important for piezo sensor)

[tmc2209 stepper_z]
uart_pin: PG14
interpolate: true
run_current: 0.85          # Lower current for Z (doesn't need high speed)
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999  # Always StealthChop (quieter for Z)
driver_SGTHRS: 50          # StallGuard threshold for Z
diag_pin: PF0


# ============================================================================
# Z1 AXIS — Motor6 (Z2, right lead screw)
# ============================================================================
# Connection: Motor6 on M8P board
# Purpose: right side of Z axis, synchronized with Z via z_tilt
[stepper_z1]
step_pin: PG9
dir_pin: !PD7
enable_pin: !PG11
microsteps: 16
rotation_distance: 8
endstop_pin: tmc2209_stepper_z1:virtual_endstop

[tmc2209 stepper_z1]
uart_pin: PG10
interpolate: True
run_current: 0.85
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999
driver_SGTHRS: 50
diag_pin: PC15


# ============================================================================
# EXTRUDER — Motor7
# ============================================================================
# Connection: Motor7 on M8P board
[extruder]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.6295166  # mm per mm of extruded filament (tuned)
nozzle_diameter: 0.6       # Nozzle diameter (mm)
filament_diameter: 1.75    # Filament diameter (mm)
max_extrude_only_distance: 150  # Max extrusion length without movement
max_extrude_only_velocity: 30
max_extrude_only_accel: 5000
heater_pin: PA0            # Hotend heater pin
sensor_type: EPCOS 100K B57560G104F  # Thermistor type
sensor_pin: PB0            # Thermistor pin
control: pid               # PID temperature control
pid_Kp: 22.2               # PID coefficients (tuned via PID_CALIBRATE)
pid_Ki: 1.08
pid_Kd: 114
max_power: 1.0             # Maximum heater power
min_temp: 10               # Minimum temperature (breakage protection)
max_temp: 310              # Maximum temperature (overheat protection)
min_extrude_temp: 130      # Minimum temperature for extrusion
max_extrude_cross_section: 20
instantaneous_corner_velocity: 1.000
pressure_advance: 0.058    # Pressure compensation (tuned)
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: PD5
interpolate: True
run_current: 0.7           # Lower current for extruder
sense_resistor: 0.110
stealthchop_threshold: 0


# ============================================================================
# BED PROBE (Piezo Bed Sensor)
# ============================================================================
# Piezoelectric sensor for Z zero point detection.
# Connection: Endstop1 (PF4) — digital output from sensor.
# Inversion (!) means the signal is active LOW.
# 
# IMPORTANT: z_offset=0 because calibration is handled by the piezo sensor.
# Speed 5 mm/s — optimal for piezo sensor (not too fast).
[probe]
pin: !PF4
z_offset: 0                # Z offset (0 = sensor defines zero itself)
speed: 5.0                 # Probing speed (mm/s)
samples: 3                 # Number of measurements for averaging
sample_retract_dist: 2.0   # Retract distance between measurements
lift_speed: 5.0            # Lift speed between measurements


# ============================================================================
# BED HEATER
# ============================================================================
[heater_bed]
heater_pin: PF5            # Bed heater control pin
sensor_pin: PB1            # Bed thermistor pin
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 54.0               # PID coefficients for bed
pid_Ki: 2.5
pid_Kd: 290.0
min_temp: 0
max_temp: 150              # Maximum bed temperature


# ============================================================================
# FANS
# ============================================================================
# FAN1 — part cooling fan (controlled via G-code M106/M107)
[fan]
pin: PF9

# FAN0 — hotend fan (turns on when temperature > 50°C)
[heater_fan hotend_fan]
pin: PF7
heater: extruder
kick_start_time: 0.5       # Spin-up time for startup
heater_temp: 50.0          # Turn-on temperature
#hardware_pwm: False
cycle_time: 0.01
max_power: 1
fan_speed: 1

# FAN4 — LED lighting (controlled as generic fan)
[fan_generic led_strip]
pin: PA4


# ============================================================================
# FILAMENT SENSOR
# ============================================================================
# Mechanical filament runout/end sensor.
# Connection: Endstop2 (PF3), with pull-up (^).
[filament_switch_sensor filament_sensor]
switch_pin: ^PF3
pause_on_runout: True      # Auto-pause on runout
runout_gcode:
    M118 Filament runout detected!
    PAUSE
insert_gcode:
    M118 Filament inserted

event_delay: 3.0
pause_delay: 0.5


# ============================================================================
# BED MESH
# ============================================================================
# Bed unevenness compensation via height matrix.
# Measured automatically with BED_MESH_CALIBRATE command.
[bed_mesh]
speed: 120                 # Travel speed between points
horizontal_move_z: 5       # Travel height between points
mesh_min: 10, 10           # Mesh start point
mesh_max: 210, 210         # Mesh end point
probe_count: 5, 5          # Number of points (5x5 = 25 points)
mesh_pps: 2, 2             # Points per segment for interpolation
algorithm: bicubic         # Interpolation algorithm
bicubic_tension: 0.2       # Bicubic surface tension


# ============================================================================
# Z ALIGNMENT (Z Tilt)
# ============================================================================
# For printers with dual Z motors — automatic bed leveling
# relative to the nozzle.
# z_positions — Z screw coordinates in printer coordinate system.
# points — measurement points to determine tilt.
[z_tilt]
z_positions:
    -25, 110    # Left Z screw (X, Y)
    245, 110    # Right Z screw (X, Y)
points:
    10, 110     # Left side (10mm past edge)
    212, 110     # Right side (10mm before edge)
speed: 120
horizontal_move_z: 10      # Travel height between points
retries: 10                # Maximum alignment attempts
retry_tolerance: 0.02      # Allowed tolerance (mm)


# ============================================================================
# SAFE Z HOMING
# ============================================================================
# Before homing Z, first homes XY to the specified position
# so the nozzle doesn't hit the print or brackets.
[safe_z_home]
home_xy_position: -2, -2.5  # XY homing position before Z
speed: 50.0
z_hop: 10.0                # Lift before homing
z_hop_speed: 15.0


# ============================================================================
# INPUT SHAPER HARDWARE (ADXL345)
# ============================================================================
# ADXL345 — accelerometer for resonance measurement.
# SPI connection: cs_pin=PA15, bus spi3a
[adxl345]
cs_pin: PA15
spi_bus: spi3a

# Resonance measurement point (center of bed)
[resonance_tester]
accel_chip: adxl345
probe_points: 110, 110, 20


# ============================================================================
# BOARD PIN ALIASES
# ============================================================================
# Convenient names for screen/button pins.
[board_pins]
aliases:
    EXP1_1=PE7, EXP1_2=PG1,
    EXP1_3=PG0, EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>


# ============================================================================
# MACROS FOR PIEZO SENSOR
# ============================================================================
# Convenient short commands for sensor control.
# Full commands are defined in piezo_sensor.cfg (piezo_bed_sensor module).

# Calibrate sensor thresholds
[gcode_macro BED_SENSOR_CALIBRATE]
description: Calibrate piezo bed sensor thresholds
gcode: CALIBRATE_BED_SENSOR

# Read current thresholds
[gcode_macro READ_BED_THRESHOLDS]
description: Read current piezo bed sensor thresholds
gcode: READ_BED_SENSOR

# Manually set thresholds
[gcode_macro SET_BED_THRESHOLDS]
description: Set piezo bed sensor thresholds manually
gcode: SET_BED_SENSOR_THRESHOLD


# ============================================================================
# START PRINT MACRO (START_PRINT)
# ============================================================================
# Automatic pre-print preparation:
# 1. Home all axes
# 2. Heat bed + preheat nozzle to 150°C (anti-ooze)
# 3. Wait for bed temperature
# 4. Move to safe position and validate sensor
# 5. Move to cleaning position (hole in "ear")
# 6. Heat nozzle to working temperature
# 7. Purge 25 mm
# 8. Cool to 130°C and draw cleaning lines
# 9. Z alignment (Z_TILT_ADJUST)
# 10. Probe real Z=0
# 11. Load/calibrate bed mesh
# 12. Move to start position
#
# Slicer parameters:
#   BED_TEMP — bed temperature
#   EXTRUDER_TEMP — nozzle temperature
#   MESH_MODE — mesh mode (load/calibrate/save/skip)
#   MESH_NAME — mesh profile name
#   NOZZLE — nozzle diameter
[gcode_macro START_PRINT]
gcode:
    # Parameters from slicer
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set MESH_MODE = params.MESH_MODE|default('load')|string|lower %}
    {% set MESH_NAME = params.MESH_NAME|default('default')|string %}
    {% set NOZZLE = params.NOZZLE|default(0.4)|float %}
    
    # Validate mesh mode
    {% if MESH_MODE not in ['load', 'calibrate', 'save', 'skip'] %}
        {action_raise_error("Invalid MESH_MODE '%s'. Use: load, calibrate, save, or skip" % MESH_MODE)}
    {% endif %}
    
    # Calculate purge line parameters
    {% set LAYER_H = NOZZLE * 0.5 %}
    {% set LINE_W = NOZZLE * 1.5 %}
    {% set PURGE_LEN = 55.0 %}
    {% set PURGE_VOL = PURGE_LEN * LAYER_H * LINE_W %}
    {% set FILAMENT_AREA = 3.14159 * ((1.75 / 2) ** 2) %}
    {% set E_PURGE = (PURGE_VOL / FILAMENT_AREA) * 1.5 %}
    
    # Z height for cleaning (touch point + layer height)
    {% set Z_CLEAN = -5.150 + LAYER_H %}
    M83
    M118 Starting print...
    
    # 1. Home all axes
    G28
    
    # 2. Heat bed + preheat nozzle to 150 (anti-ooze)
    M140 S{BED_TEMP}
    M104 S150
    
    # 3. Wait for bed temperature
    M190 S{BED_TEMP}
    
    # 4. Move to safe position and validate sensor
    G1 X111 Y112 Z50 F3000
    M400
    VALIDATE_BED_SENSOR
    
    # 5. Move to cleaning position (hole in "ear")
    G1 X8 Y-2.5 F3000
    G1 Z{Z_CLEAN}
    
    # 6. Heat to working temperature
    M109 S{EXTRUDER_TEMP}
    
    # 7. Purge 25 mm (compensate retract + blobs)
    G1 E25 F150
    
    # 8. Cool down and draw cleaning lines
    M104 S130
    
    # Line 1: extrude at 5 mm/s (F300)
    G1 X63 Y-2.5 Z{Z_CLEAN} E{E_PURGE} F300
    
    # Retract
    G1 E-20 F3000
    
    # Move to second line
    G1 Y2.5 F3000
    
    # Line 2: travel only (3 mm/s = F180), cuts the string
    G1 X-2 Y2.5 Z{Z_CLEAN} F180
    
    # 9. Dual Z alignment
    Z_TILT_ADJUST
    
    # 10. Probe real Z=0
    G1 X110 Y110 F3000
    PROBE
    G92 Z0
    
    # 11. Move to safe position
    G1 Z10 F3000
    G1 X0 Y0 F3000
    
    # 12. Wait for working temperature
    M109 S{EXTRUDER_TEMP}
    
    # 13. Deretraction before print
    G1 E20 F600
    
    # 14. Bed mesh handling
    {% if MESH_MODE == 'calibrate' %}
        M118 Calibrating bed mesh (RAM only)...
        BED_MESH_CALIBRATE
    {% elif MESH_MODE == 'save' %}
        M118 Calibrating and saving bed mesh...
        BED_MESH_CALIBRATE
        BED_MESH_PROFILE SAVE={MESH_NAME}
        SAVE_CONFIG
    {% elif MESH_MODE == 'load' %}
        M118 Loading bed mesh profile '{MESH_NAME}'...
        BED_MESH_PROFILE LOAD={MESH_NAME}
    {% endif %}
    # MESH_MODE == 'skip' — nothing to do
    
    # 15. Move to start position
    G1 Z5 F3000
    M82
    
    M118 Print started!


# ============================================================================
# END PRINT MACRO (END_PRINT)
# ============================================================================
# Automatic actions after printing:
# 1. Filament retract
# 2. Turn off heaters
# 3. Turn off part cooling
# 4. Lift nozzle
# 5. Park at back
# 6. Disable extruder motor (keep XYZ for bed cooling)
[gcode_macro END_PRINT]
gcode:
    M118 Print complete!
    
    # Quick retract before anything else
    M83
    G1 E-20 F3000
    M82
    # Turn off heaters
    M104 S0
    M140 S0
    
    # Turn off part cooling fan
    M106 S0
    
    # Lift nozzle
    G91
    G1 Z10 F3000
    G90
    
    # Park at back
    G1 X0 Y220 F3000
    
    # Release extruder motor only (keep XYZ for bed cooling)
    M84 E


# ============================================================================
# I2C DIAGNOSTIC (Piezo Sensor Stress Test)
# ============================================================================
# I2C bus stress test: 100 cycles of write/read with heated bed.
# Used to check communication stability with piezo sensor.
# 
# USAGE: DIAGNOSE_IIC
[gcode_macro DIAGNOSE_IIC]
description: I2C stress test (100 cycles, heated bed)
gcode:
    M118 Starting I2C diagnostic...
    
    # Heat bed to 60°C
    M140 S60
    M190 S60
    M118 Bed ready, starting test...
    
    # Move to safe position
    G1 X111 Y112 Z50 F3000
    M400
    
    {% for i in range(100) %}
        # Write test thresholds
        SET_BED_SENSOR_THRESHOLD THRESHOLDS=200,200,200,200
        G4 P100
        
        # Read back
        READ_BED_SENSOR
        
        # Progress every 10 cycles
        {% if (i + 1) % 10 == 0 %}
            M118 Progress: {i + 1}/100 cycles
        {% endif %}
    {% endfor %}
    
    M118 I2C test complete. Check console for errors.


